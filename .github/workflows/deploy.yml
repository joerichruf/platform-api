name: Deploy

on:
  workflow_dispatch:
    inputs:
      service:
        description: 'Service to deploy'
        required: true
      version:
        description: 'Version to deploy'
        required: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Simulate deployment
        run: |
          echo "Deploying ${{ inputs.service }} version ${{ inputs.version }}"
          sleep 10
          echo "Done"
